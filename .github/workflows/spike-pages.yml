name: spike-pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'spikes/web_spike/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/configure-pages@v6
      - name: Build web
        working-directory: spikes/web_spike
        run: flutter build web --release --base-href /flutter-kiro-skeleton/
      - name: SPA fallback
        working-directory: spikes/web_spike
        run: cp build/web/index.html build/web/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: spikes/web_spike/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
